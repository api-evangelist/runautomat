overlay: 1.0.0
info:
  title: API Evangelist enhancements for Automat Extract API
  version: 1.0.0
extends: openapi/runautomat-extract-openapi.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: runautomat
    x-apievangelist-product: Automat Document Extraction (IDP)
    x-apievangelist-auth: http-bearer (API key, ak_ prefix)
    x-apievangelist-compliance:
    - SOC 2
    - ISO 27001
    - HIPAA
    - GDPR
    x-apievangelist-docs: https://docs.runautomat.com/guides/getting-started/introduction
- target: $.paths['/api/extract'].post
  update:
    x-apievangelist-idempotent: false
    x-apievangelist-error-envelope: 'custom {error, message}'
    x-apievangelist-notes: >-
      Synchronous document extraction against a preconfigured extractor
      (extractorId, ext_ prefix). File input via binary/base64/data-url/URL.
