name: Runautomat
description: >-
  Runautomat (dba Automat) builds AI agents that operate computers the way people do, replacing
  legacy RPA tools like UiPath, Automation Anywhere, and Blue Prism with self-healing managed
  automations. Founded in 2022 by ex-Google engineers Lucas Ochoa and Gautam Bose and backed by
  Felicis, Khosla Ventures, Initialized Capital, and Y Combinator. The platform spans UI-based AI
  agents (Computer Use RPA), AI document extraction (IDP), API-based automations (iPaaS), and a
  managed forward-deployed-engineer service. Its public developer surface is the Automat Document
  Extraction API, a single synchronous /api/extract operation that turns PDFs and images into
  structured JSON matching a configured extractor, authenticated with an organization API key.
